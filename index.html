<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Nummo · Tus finanzas, por fin en orden</title>
    <meta
      name="description"
      content="Nummo reúne cobros, pagos y movimientos en una sola experiencia. Menos dispersión, más control para decidir mejor."
    />
    <link rel="canonical" href="https://nummo.app/" />

    <link rel="icon" sizes="48x48" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      La portada NO lleva manifest ni service worker: son de la app, que vive en /app.

      El `theme-color` es `--background` de `index.css`, y tiene que seguir siéndolo: esto
      pinta la barra del navegador ANTES de que corra nada, así que un valor viejo aquí es
      un fogonazo del color equivocado en cada carga. Estuvo en crema y verde hasta agosto
      de 2026 —la paleta «bosque», que se descartó— porque nada lo vigilaba; ahora sí:
      `src/marketing/theme.test.ts`.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220" />
    <meta name="color-scheme" content="light dark" />

    <!-- Previsualización al compartir el enlace -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nummo" />
    <meta property="og:title" content="Nummo · Tus finanzas, por fin en orden" />
    <meta
      property="og:description"
      content="Nummo reúne cobros, pagos y movimientos en una sola experiencia. Menos dispersión, más control para decidir mejor."
    />
    <!--
      Absoluta a propósito: la especificación de Open Graph pide URL completa y varios
      raspadores —WhatsApp entre ellos— no resuelven una relativa, así que la vista previa
      se quedaba sin imagen justo donde más se comparte.

      Y la tarjeta es `summary` y no `summary_large_image` porque lo único que hay es el
      icono de 512×512: en una tarjeta ancha un cuadrado se recorta o se rellena con barras.
      El día que exista una imagen 1200×630 de verdad, esto vuelve a `summary_large_image`.
    -->
    <meta property="og:image" content="https://nummo.app/icons/icon-512.png" />
    <meta property="og:url" content="https://nummo.app/" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <!--
      Marca que hay JavaScript ANTES de pintar. Las secciones de la portada arrancan
      escondidas para poder revelarse al entrar, y sin esta clase quien navega sin
      JavaScript —o cualquier previsualización de enlace— vería la página con el medio en
      blanco. Va en línea y no en el módulo: un `<script type="module">` es diferido, y
      para entonces el primer pintado ya ocurrió.
    -->
    <script>
      document.documentElement.classList.add('con-js')
    </script>
    <div id="portada"></div>
    <script type="module" src="/src/marketing/main.tsx"></script>
  </body>
</html>
