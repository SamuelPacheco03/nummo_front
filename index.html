<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Nummo · Tus finanzas, por fin en orden</title>
    <meta
      name="description"
      content="Nummo conecta cobros, pagos y movimientos en una sola experiencia. Menos dispersión, más control para decidir mejor."
    />
    <link rel="canonical" href="https://nummo.app/" />

    <link rel="icon" sizes="48x48" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      La portada NO lleva manifest ni service worker: son de la app, que vive en /app.
      El `theme-color` sale de la paleta de la portada (crema y verde), no de la consola.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f1e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1712" />
    <meta name="color-scheme" content="light dark" />

    <!-- Previsualización al compartir el enlace -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nummo" />
    <meta property="og:title" content="Nummo · Tus finanzas, por fin en orden" />
    <meta
      property="og:description"
      content="Nummo conecta cobros, pagos y movimientos en una sola experiencia. Menos dispersión, más control para decidir mejor."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:url" content="https://nummo.app/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="portada"></div>
    <script type="module" src="/src/marketing/main.tsx"></script>
  </body>
</html>
